<!DOCTYPE html>
<html lang="en" data-theme="orange">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weather</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main class="shell">
    <header>
      <p class="kicker">Weather API</p>
      <h1>Current conditions</h1>
    </header>
    <form id="form">
      <label>
        City
        <input id="city" name="city" type="text" placeholder="Berlin" value="Berlin" autocomplete="off" />
      </label>
      <div class="row">
        <label>
          Latitude
          <input id="latitude" name="latitude" type="number" step="any" placeholder="52.52" />
        </label>
        <label>
          Longitude
          <input id="longitude" name="longitude" type="number" step="any" placeholder="13.41" />
        </label>
      </div>
      <button type="submit">Get weather</button>
      <button id="save" type="button" class="secondary">Save place</button>
    </form>
    <p id="status" class="status" hidden></p>
    <section id="result" class="card" hidden></section>
    <section id="places-wrap">
      <h2>Saved places</h2>
      <ul id="places" class="saved-list"></ul>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
