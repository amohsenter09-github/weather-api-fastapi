apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-api
  namespace: weather-api
  labels:
    app: weather-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weather-api
  template:
    metadata:
      labels:
        app: weather-api
    spec:
      containers:
        - name: weather-api
          image: amohsen/weather-api-fastapi:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: APP_NAME
              value: weather-api-fastapi
            - name: LOG_LEVEL
              value: INFO
            - name: OPEN_METEO_BASE_URL
              value: https://api.open-meteo.com/v1
            - name: OPEN_METEO_GEOCODING_BASE_URL
              value: https://geocoding-api.open-meteo.com/v1
            - name: HTTP_TIMEOUT_SECONDS
              value: "10"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi

