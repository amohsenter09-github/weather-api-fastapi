apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-api
  labels:
    app: weather-api
spec:
  # NOTE: this repo was deployed to an EKS nodegroup with a single small node (max pods=8),
  # which caused scheduling failures for replicas=2. Increase nodegroup size/capacity to run >1 replica.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # With a single node at max pod capacity, we can't temporarily "surge" a new pod.
      # This setting replaces the pod in-place (may cause brief downtime for replicas=1).
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: weather-api
  template:
    metadata:
      labels:
        app: weather-api
    spec:
      containers:
        - name: weather-api
          image: 918780499156.dkr.ecr.eu-west-1.amazonaws.com/weather-platform:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: weather-api
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi

