apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - namespace.yaml

# All namespaced resources from the base will be deployed into this namespace
namespace: weather-api

patches:
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: weather-api
    path: ingress-group.patch.yaml
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: RoleBinding
      name: weather-api
    path: rbac-rolebinding-patch.yaml
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: weather-api-ingress
    path: networkpolicy-ingress-patch.yaml

