# development cluster VPC CIDR (envs/dev: 10.30.0.0/16)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: air-quality-api-ingress
spec:
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8000
    - from:
        - ipBlock:
            cidr: 10.30.0.0/16
      ports:
        - protocol: TCP
          port: 8000
