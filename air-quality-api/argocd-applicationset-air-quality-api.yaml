apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: air-quality-api
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - env: development
            server: https://8DC75C7A66ACEF04D7834ACCD553A9AE.gr7.eu-west-1.eks.amazonaws.com
            path: air-quality-api/overlays/development
            namespace: air-quality-api-development
            project: development
          - env: uat
            server: https://238706E93E5AF8032A6F5799E6BAB58F.sk1.eu-west-1.eks.amazonaws.com
            path: air-quality-api/overlays/uat
            namespace: air-quality-api-uat
            project: uat
          - env: production
            server: https://F34A6680DB27ABDBE242F4C47AA534A2.yl4.eu-west-1.eks.amazonaws.com
            path: air-quality-api/overlays/production
            namespace: air-quality-api
            project: production
  template:
    metadata:
      name: 'air-quality-api-{{env}}'
    spec:
      project: '{{project}}'
      source:
        repoURL: https://github.com/amohsenter09-github/weather-api-fastapi.git
        targetRevision: master
        path: '{{path}}'
      destination:
        server: '{{server}}'
        namespace: '{{namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
