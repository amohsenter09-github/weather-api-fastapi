apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: air-quality-api-ingress
  labels:
    app: air-quality-api
spec:
  podSelector:
    matchLabels:
      app: air-quality-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8000
    - from:
        - ipBlock:
            cidr: 10.0.0.0/16
      ports:
        - protocol: TCP
          port: 8000
