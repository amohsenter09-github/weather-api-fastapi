apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: weather-api
  namespace: weather-api
  annotations:
    # Use AWS Load Balancer Controller (ALB)
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/success-codes: "200"
    # ExternalDNS (Route53) - creates/updates the DNS record automatically
    external-dns.alpha.kubernetes.io/hostname: weather.infra-ai-art.delivery
spec:
  ingressClassName: alb
  rules:
    - host: weather.infra-ai-art.delivery
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: weather-api
                port:
                  number: 80

