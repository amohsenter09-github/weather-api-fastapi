apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-weather-api-development
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:amohsenter09-github/weather-api-fastapi.git
    targetRevision: master
    path: k8s-eks/overlays/development
  destination:
    server: https://kubernetes.default.svc
    namespace: weather-api-development
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
