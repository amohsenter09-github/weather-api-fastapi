apiVersion: v1
kind: ConfigMap
metadata:
  name: weather-api
  labels:
    app: weather-api
data:
  APP_NAME: weather-api-fastapi
  LOG_LEVEL: INFO
  OPEN_METEO_BASE_URL: https://api.open-meteo.com/v1
  OPEN_METEO_GEOCODING_BASE_URL: https://geocoding-api.open-meteo.com/v1
  HTTP_TIMEOUT_SECONDS: "10"
