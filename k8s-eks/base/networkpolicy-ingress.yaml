apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: weather-api-ingress
  labels:
    app: weather-api
spec:
  podSelector:
    matchLabels:
      app: weather-api
  policyTypes:
    - Ingress
  ingress:
    # Allow from pods in same namespace (Service -> Pod, same-env only)
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8000
    # Allow from ALB (traffic arrives from VPC)
    - from:
        - ipBlock:
            cidr: 10.0.0.0/16
      ports:
        - protocol: TCP
          port: 8000
